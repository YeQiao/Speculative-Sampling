# Guidance training starting from PRETRAIN (no KD) for ablation
# Shows whether guidance alone is sufficient without KD intermediate
#
# Usage:
#   python -m guided_mamba.run fit --config pretrain/config_guide_45m_from_pretrain.yaml

seed_everything: 0
trainer:
  accelerator: auto
  strategy: auto
  devices: 1
  precision: bf16-mixed
  max_epochs: 7
  gradient_clip_val: 0.5
  log_every_n_steps: 20
  enable_progress_bar: true
  val_check_interval: 1.0
  check_val_every_n_epoch: 1
  default_root_dir: "/HSC/users/qiaoye/SSM_SPEC/checkpoints/mamba2-45m-guided-from-pretrain"
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: "/HSC/users/qiaoye/SSM_SPEC/checkpoints/mamba2-45m-guided-from-pretrain/ckpts"
        filename: "step-{step}-val_loss-{val_loss:.4f}"
        monitor: "val/loss"
        mode: "min"
        save_top_k: 3
        every_n_epochs: 1
        save_last: true

model:
  verifier: "/HSC/users/qiaoye/checkpoints/Llama3.1-8B-hf"
  drafter: "/HSC/users/qiaoye/SSM_SPEC/checkpoints/mamba2-45m-pretrain/final"
  v_layers: [29]
  steer_z: false
  d_layers: "all"
  ngram: 8
  pos_method: "regular"
  loss_method: "tvd"
  finetune_drafter: true
  lr_start: 3e-4
  lr_end: 3e-5
  warmup_steps: 30
  n_spec_dec_batches: 4
  tgt_len: 64
  greedy_sample: false

data:
  path: "/HSC/users/qiaoye/SSM_SPEC/data/ultrachat_guided"
  bsz: 8
