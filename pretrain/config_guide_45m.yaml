# Guidance training config for Mamba2-45M drafter
# Based on sweep findings: single layer 29 ≈ triple [5,16,29], so keep it simple
#
# Usage:
#   python -m guided_mamba.run fit --config pretrain/config_guide_45m.yaml

seed_everything: 0
trainer:
  accelerator: auto
  strategy: auto
  devices: auto
  precision: bf16-mixed
  max_epochs: 10
  gradient_clip_val: 0.5
  log_every_n_steps: 20
  enable_progress_bar: true
  val_check_interval: 1.0
  check_val_every_n_epoch: 1
  default_root_dir: "/HSC/users/qiaoye/SSM_SPEC/checkpoints/mamba2-45m-guided"
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: "/HSC/users/qiaoye/SSM_SPEC/checkpoints/mamba2-45m-guided/ckpts"
        filename: "step-{step}-val_loss-{val/loss:.4f}"
        monitor: "val/loss"
        mode: "min"
        save_top_k: 3
        every_n_epochs: 1
        save_last: true

model:
  verifier: "/HSC/users/qiaoye/checkpoints/Llama3.1-8B-hf"
  # ← Update after KD finishes:
  drafter: "/HSC/users/qiaoye/SSM_SPEC/checkpoints/mamba2-45m-kd/final"
  # Single layer 29 — sweep showed it matches [5,16,29] when backbone is finetuned
  v_layers: [29]
  steer_z: false               # sweep showed no benefit
  d_layers: "all"
  ngram: 8
  pos_method: "regular"
  loss_method: "tvd"
  finetune_drafter: true        # critical: +24% acceptance vs frozen
  lr_start: 3e-4
  lr_end: 3e-5
  warmup_steps: 30
  n_spec_dec_batches: 4
  tgt_len: 64
  greedy_sample: false

data:
  path: "/HSC/users/qiaoye/SSM_SPEC/data/ultrachat_guided"
  bsz: 8
