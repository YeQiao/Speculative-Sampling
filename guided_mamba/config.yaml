seed_everything: 0
trainer:
  accelerator: auto
  strategy: auto
  devices: auto
  precision: bf16-mixed
  max_epochs: 10
  gradient_clip_val: 0.5
  log_every_n_steps: 20
  enable_progress_bar: true
  val_check_interval: 1.0
  check_val_every_n_epoch: 1
  default_root_dir: "/HSC/users/qiaoye/SSM_SPEC/checkpoints/guided_mamba"
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: "/HSC/users/qiaoye/SSM_SPEC/checkpoints/guided_mamba/ckpts"
        filename: "step-{step}-val_loss-{val/loss:.4f}"
        monitor: "val/loss"
        mode: "min"
        save_top_k: 3
        every_n_epochs: 1
        save_last: true

model:
  verifier: "/HSC/users/qiaoye/checkpoints/Llama3.1-8B-hf"
  drafter: "/HSC/users/qiaoye/SSM_SPEC/checkpoints/improved-mamba-alignment/checkpoint-750"
  v_layers: [5, 16, 29]       # low, mid, high layers of LLaMA-3.1-8B (32 layers total)
  steer_z: false               # set true to also steer gating branch
  d_layers: "all"              # "all" or list of drafter layer indices
  ngram: 8
  pos_method: "regular"
  loss_method: "tvd"
  finetune_drafter: true
  lr_start: 3e-4
  lr_end: 3e-5
  warmup_steps: 30
  n_spec_dec_batches: 4
  tgt_len: 64
  greedy_sample: false

data:
  path: "/HSC/users/qiaoye/SSM_SPEC/data/ultrachat_guided"
  bsz: 8
