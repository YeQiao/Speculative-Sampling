seed_everything: 0
trainer:
  accelerator: auto
  strategy: auto
  devices: 1                    # single logical device; 70B sharded via device_map
  precision: bf16-mixed
  max_epochs: 5
  gradient_clip_val: 0.5
  log_every_n_steps: 20
  enable_progress_bar: true
  val_check_interval: 1.0
  check_val_every_n_epoch: 1
  default_root_dir: "/HSC/users/qiaoye/SSM_SPEC/checkpoints/guided_mamba_70b"
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: "/HSC/users/qiaoye/SSM_SPEC/checkpoints/guided_mamba_70b/ckpts"
        filename: "step-{step}-val_loss-{val/loss:.4f}"
        monitor: "val/loss"
        mode: "min"
        save_top_k: 3
        every_n_epochs: 1
        save_last: true

model:
  verifier: "/HSC/users/qiaoye/checkpoints/Llama-3.1-70B"
  drafter: "/HSC/users/qiaoye/SSM_SPEC/checkpoints/improved-mamba-alignment/checkpoint-750"
  v_layers: [75]               # high layer of LLaMA-3.1-70B (80 layers total)
  steer_z: false
  d_layers: "all"
  ngram: 8
  pos_method: "regular"
  loss_method: "tvd"
  finetune_drafter: true
  lr_start: 3e-4
  lr_end: 3e-5
  warmup_steps: 30
  n_spec_dec_batches: 0         # skip spec-dec eval during training (too slow with 70B)
  tgt_len: 64
  greedy_sample: false

data:
  path: "/HSC/users/qiaoye/SSM_SPEC/data/ultrachat_guided"
  bsz: 8                        # 8-bit quantized verifier frees enough memory for bsz=8
